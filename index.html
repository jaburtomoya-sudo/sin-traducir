<style>
/* Layout: una "escena" centrada por paso (imagen primero, después la acción), pensada para tablet en vertical u horizontal. */
:root {
  --paper: #edf2ef; --card: #ffffff; --ink: #1b2a2f; --muted: #5b6b6f; --line: #d3ddd9;
  --teal: #0e6b63; --teal-soft: #d6ebe7; --sun: #f2a900; --sun-ink: #3a2a00;
  --good: #1f7a3d; --warn: #a86400; --bad: #b23a2e;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 18px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0f1719; --card: #172327; --ink: #e5eeeb; --muted: #9fb1ad; --line: #2a3a3e;
    --teal: #4fc2b4; --teal-soft: #173a37; --sun: #f5b82e; --sun-ink: #2a1e00;
    --good: #5cc781; --warn: #e3a23c; --bad: #ef7d70; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
.wrap { max-width: 900px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px; display: flex; flex-direction: column; gap: 20px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; }
.brand s { text-decoration-color: var(--sun); text-decoration-thickness: 4px; color: var(--muted); font-weight: 700; }
.chip { font-size: 14px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.02em; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; }
h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 700; }
h3 { font-size: 20px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
button:disabled { cursor: default; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 0 26px; border-radius: 999px; font-weight: 700; font-size: 19px; }
.btn-main { background: var(--teal); color: var(--card); }
.btn-sun { background: var(--sun); color: var(--sun-ink); }
.btn-ghost { background: var(--card); border: 2px solid var(--line); }
.btn-small { min-height: 46px; padding: 0 16px; font-size: 16px; }
.btn svg { width: 24px; height: 24px; flex: none; }
.btn.listening { background: var(--bad); color: #fff; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--bad) 25%, transparent); } }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--paper); border-radius: 14px; padding: 14px; }
.stat b { display: block; font-family: var(--display); font-size: 32px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 14px; color: var(--muted); }
.lessons { display: grid; gap: 10px; }
.lesson { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--paper); border-radius: 14px; padding: 12px 14px; }
.lesson .num { font-family: var(--display); font-weight: 800; font-size: 22px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--card); border: 2px solid var(--line); }
.lesson.now .num { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
.lesson.locked { opacity: 0.55; }
.meter { height: 8px; background: var(--card); border-radius: 999px; overflow: hidden; margin-top: 6px; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--teal); }
.lesson small { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.phrases { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.phrase { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: left; display: grid; gap: 4px; min-width: 0; }
.phrase .pic { font-size: 38px; line-height: 1; }
.phrase .en { font-weight: 700; overflow-wrap: anywhere; }
.lvl { display: flex; gap: 3px; }
.lvl i { width: 14px; height: 5px; border-radius: 3px; background: var(--line); }
.lvl i.on { background: var(--teal); }
details.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; }
details.box summary { cursor: pointer; font-weight: 700; font-family: var(--display); font-size: 19px; }
details.box ul { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 8px; }
.settings { display: grid; gap: 14px; margin-top: 12px; }
.field { display: grid; gap: 6px; }
.field input, .field select { font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); min-height: 52px; }
.note { font-size: 15px; color: var(--muted); }
.alert { background: var(--teal-soft); border-radius: 14px; padding: 14px 16px; font-size: 16px; }
.bar { height: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--teal); border-radius: 999px; transition: width .3s; }
.stage { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: clamp(20px, 4vw, 40px); display: grid; gap: 20px; justify-items: center; text-align: center; }
.stage .kind { justify-self: stretch; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.big-pic { font-size: clamp(100px, 20vw, 180px); line-height: 1; user-select: none; }
.cue { font-size: 19px; max-width: 36ch; }
.gesture { background: var(--teal-soft); border-radius: 14px; padding: 12px 18px; font-size: 17px; display: flex; gap: 10px; align-items: center; text-align: left; max-width: 46ch; }
.gesture svg { width: 26px; height: 26px; flex: none; color: var(--teal); }
.answer { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6vw, 52px); letter-spacing: -0.02em; line-height: 1.15; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 0 .28em; justify-content: center; }
.answer .w.ok { color: var(--good); }
.answer .w.no { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.heard { font-size: 16px; color: var(--muted); }
.verdict { font-weight: 700; font-size: 20px; }
.verdict.ok { color: var(--good); } .verdict.mid { color: var(--warn); } .verdict.no { color: var(--bad); }
.sound { font-size: 17px; color: var(--muted); }
.peek { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.reveal { font-size: 16px; color: var(--muted); }
.rate { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 640px; }
.rate button { min-height: 72px; border-radius: 16px; font-weight: 700; font-size: 17px; border: 2px solid var(--line); background: var(--paper); padding: 8px; }
.rate .r-bad { border-color: var(--bad); color: var(--bad); }
.rate .r-mid { border-color: var(--warn); color: var(--warn); }
.rate .r-good { border-color: var(--good); color: var(--good); }
.rate .suggest { box-shadow: 0 0 0 4px var(--sun); }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 560px; }
.choice { background: var(--paper); border: 3px solid var(--line); border-radius: 18px; font-size: clamp(54px, 12vw, 88px); line-height: 1; padding: 18px 8px; }
.choice.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card)); }
.choice.no { border-color: var(--bad); opacity: 0.6; }
.story { display: grid; gap: 10px; width: 100%; max-width: 640px; }
.line { display: flex; align-items: center; gap: 14px; background: var(--paper); border-radius: 14px; padding: 10px 14px; text-align: left; border: 2px solid transparent; }
.line .pic { font-size: 40px; line-height: 1; flex: none; }
.line .en { font-weight: 700; font-size: 20px; min-width: 0; overflow-wrap: anywhere; }
.line.now { border-color: var(--sun); }
.story.pics-only { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.story.pics-only .line { flex-direction: column; justify-content: center; }
.story.pics-only .line .pic { font-size: 54px; }
.timer { width: 100%; max-width: 640px; height: 16px; border-radius: 999px; background: var(--paper); overflow: hidden; border: 1px solid var(--line); }
.timer > i { display: block; height: 100%; width: 100%; background: var(--sun); transform-origin: left; }
.secs { font-family: var(--display); font-weight: 800; font-size: 44px; font-variant-numeric: tabular-nums; }
.bubble { background: var(--teal-soft); border-radius: 22px 22px 22px 6px; padding: 18px 22px; font-size: 20px; max-width: 32ch; display: grid; gap: 8px; justify-items: center; }
.bubble .who { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.feedback { font-weight: 700; font-size: 20px; min-height: 30px; }
.feedback.ok { color: var(--good); } .feedback.no { color: var(--bad); }
.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto; background: var(--card); border: 2px solid var(--sun); border-radius: 18px; padding: 16px 18px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.18); display: grid; gap: 10px; z-index: 20; font-size: 16px; }
.saved { font-size: 13px; color: var(--muted); text-align: center; }
@media (max-width: 520px) { .rate button { font-size: 15px; min-height: 64px; } .stat b { font-size: 26px; } }

<script>
(() => {
"use strict";
const LESSONS = JSON.parse(document.getElementById("content").textContent);
const ITEMS = LESSONS.flatMap((L, li) => L.items.map(i => ({ ...i, lesson: li })));
const BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));

}

try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

const app = document.getElementById("app");

/* ---------- Audio (voz británica grabada) ---------- */
const player = new Audio(); player.preload = "auto";

/* ---------- Micrófono: escucha y compara palabra por palabra ---------- */
const CONTR = { "i'm": "i am", "it's": "it is", "there's": "there is", "what's": "what is", "don't": "do not", "let's": "let us", "you're": "you are", "that's": "that is" };
const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = { 2: "twenty", 3: "thirty", 4: "forty", 5: "fifty", 6: "sixty", 7: "seventy", 8: "eighty", 9: "ninety" };
function numWord(w) {
  if (w === "ok") return "okay";
  if (!/^\d{1,3}$/.test(w)) return w;
  const n = +w;
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? " " + ONES[n % 10] : "");
  return w;
}
function words(s) {
  return s.toLowerCase().replace(/[’`]/g, "'").replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(Boolean).flatMap(w => numWord(w).split(" "));

function expand(ws) { return ws.flatMap(w => (CONTR[w] || w).split(" ")); }
/* MODO ESTRICTO: cada palabra debe coincidir EXACTA y en orden. */
function score(target, heard, itemId) {
  const raw = target.split(/\s+/).filter(Boolean);
  const hExp = expand(words(heard));
  let ptr = 0, okCount = 0, used = 0;
  const marks = raw.map((tok, k) => {
    const tw = expand(words(tok)); if (!tw.length) return { tok, ok: true, skip: true };
    const isName = itemId === "my-name" && k === raw.length - 1;
    if (isName) { const ok = hExp.length - ptr >= 1; if (ok) { okCount++; used++; ptr = hExp.length; } return { tok, ok }; }
    let p = ptr, ok = true;
    for (const x of tw) { const i = hExp.indexOf(x, p); if (i < 0) { ok = false; break; } p = i + 1; }
    if (ok) { ptr = p; okCount++; used += tw.length; }
    return { tok, ok };
  });

  return { ratio: okCount / counted, marks, extra: Math.max(0, hExp.length - used) };
}

  let best = { ratio: -1, marks: target.split(/\s+/).map(tok => ({ tok, ok: false })), heard: "", extra: 0 };
  alts.forEach((a, i) => {
    const s = score(target, a, itemId);
    if (i > 0) s.ratio = Math.min(s.ratio, 0.9); // solo la 1ª opción del reconocedor cuenta como perfecta
    if (s.ratio > best.ratio) best = { ...s, heard: a };

  if (!best.heard && alts[0]) best.heard = alts[0];

}
const gradeOf = s => (s.ratio === 1 && s.extra <= 2) ? "good" : s.ratio >= 0.6 ? "mid" : "bad";
let micDenied = false;
function listen() {
  return new Promise(resolve => {
    if (!SR) return resolve({ error: "unsupported" });
    stopAudio();
    let done = false; const end = r => { if (!done) { done = true; resolve(r); } };

}

}
function wordsView(marks) { return h("div", { class: "answer" }, marks.map(m => h("span", { class: "w " + (m.ok ? "ok" : "no") }, m.tok))); }

/* ---------- Repaso espaciado ---------- */
function rate(id, grade) {
  const it = P.items[id] || { box: 0, due: dayNum(), seen: 0 };
  it.seen = (it.seen || 0) + 1;
  if (grade === "good") { it.box = Math.min((it.box || 0) + 1, INTERVALS.length - 1); it.due = dayNum() + INTERVALS[it.box]; }
  else if (grade === "mid") { it.box = Math.max(it.box || 0, 1); it.due = dayNum() + 1; }
  else { it.box = 0; it.due = dayNum(); }
  P.items[id] = it; save();
}

/* ---------- Sesión ---------- */
let S = null;
function buildSession() {
  const due = shuffle(dueIds()).slice(0, 12);
  const nNew = due.length > 8 ? 2 : NEW_PER_SESSION;
  const newIds = ITEMS.filter(i => !known(i.id)).slice(0, nNew).map(i => i.id);
  const steps = [];
  due.forEach(id => steps.push({ t: "recall", id }));
  newIds.forEach(id => steps.push({ t: "intro", id }));
  shuffle(newIds.slice()).forEach(id => steps.push({ t: "recall", id, fresh: true }));
  const pool = [...new Set([...ITEMS.filter(i => known(i.id)).map(i => i.id), ...newIds])];
  if (pool.length >= 4) for (let k = 0; k < 6; k++) steps.push({ t: "listen", id: pool[Math.floor(Math.random() * pool.length)], pool });
  const convos = shuffle(CONVOS.filter(c => c.answers.some(a => pool.includes(a)))).sort((a, b) => b.lesson - a.lesson).slice(0, 3);
  shuffle(convos).forEach(c => steps.push({ t: "convo", c, pool }));

  const pool = ITEMS.filter(i => known(i.id)).map(i => i.id);

  const extra = [];
  shuffle(weak).slice(0, 5).forEach(id => extra.push({ t: "recall", id, extra: true }));
  for (let k = 0; k < 3; k++) extra.push({ t: "listen", id: pool[Math.floor(Math.random() * pool.length)], pool, fast: true });
  const convos = shuffle(CONVOS.filter(c => c.answers.some(a => pool.includes(a)))).slice(0, 2);
  convos.forEach(c => extra.push({ t: "convo", c, pool }));
  S.steps.splice(S.i, 0, ...extra); S.extra++;
}

  }
  const today = dayNum();
  if (!S.finalized) { S.finalized = true; if (P.lastDay !== today) { P.streak = P.lastDay === today - 1 ? (P.streak || 0) + 1 : 1; P.lastDay = today; } P.sessions = (P.sessions || 0) + 1; save(); }
  const tomorrow = ITEMS.filter(i => known(i.id) && P.items[i.id].due <= today + 1).length;
  const practiced = new Set(S.steps.filter(s => s.t === "recall").map(s => s.id)).size;
  app.append(h("section", { class: "stage" },
    h("div", { class: "big-pic", "aria-hidden": "true" }, "🎉"),
    h("h1", {}, "Sesión lista"),
    h("div", { style: "display:grid;gap:6px" },
      h("p", {}, "Practicaste ", h("b", {}, practiced), " frase" + (practiced === 1 ? "" : "s") + (S.newIds.length ? ", " + S.newIds.length + " nueva" + (S.newIds.length > 1 ? "s" : "") : "") + "."),
      h("p", {}, "Practicaste ", h("b", {}, mins + " minutos"), " hoy."),
      h("p", {}, "Racha: ", h("b", {}, P.streak + (P.streak === 1 ? " día" : " días")), "."),
      h("p", {}, tomorrow ? "Mañana te tocan " + tomorrow + " repaso" + (tomorrow > 1 ? "s" : "") + "." : "Mañana sigues con frases nuevas.")),
    h("p", { class: "muted cue" }, "Durante el día, cuando saludes o te despidas, di la frase en inglés en tu cabeza. Eso entrena pensar sin traducir."),
    h("button", { class: "btn btn-main", onclick: () => { S = null; render(); } }, "Volver al inicio")));
}

load();
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
